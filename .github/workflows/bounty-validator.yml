name: Bounty PR Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: bounty-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify PR identity
        id: identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          test -n "$PR_HEAD_SHA"
          test -n "$PR_BASE_SHA"
          test "$PR_HEAD_SHA" != "$PR_BASE_SHA"
          test "$PR_HEAD_REF" != "$PR_BASE_REF"
          echo "Head: $PR_HEAD_SHA"
          echo "Base: $PR_BASE_SHA"

      - name: Require linked open bounty issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          ISSUE=$(printf '%s\n%s\n' "$PR_BODY" "$PR_TITLE" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          if [ -z "$ISSUE" ]; then
            echo "No linked issue found."
            exit 1
          fi

          STATE=$(gh issue view "$ISSUE" --repo "$REPO" --json state,isPullRequest --jq '.state + "|" + (.isPullRequest|tostring)')
          echo "Linked issue #$ISSUE: $STATE"
          test "$STATE" = "OPEN|false"
          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Check changed files
        id: files
        run: |
          FILES=$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" 2>/dev/null || git diff --name-only origin/"$PR_BASE_REF" "$PR_HEAD_SHA")
          if [ -z "$FILES" ]; then
            echo "No changed files."
            exit 1
          fi

          EMPTY=0
          while IFS= read -r file; do
            if [ -f "$file" ] && [ ! -s "$file" ]; then
              echo "EMPTY FILE: $file"
              EMPTY=1
            fi
          done <<< "$FILES"

          test "$EMPTY" = "0"

      - name: Run repository tests
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          elif [ -f package.json ]; then
            npm install --ignore-scripts
          fi

          if [ -f package.json ] && node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No npm test script; continuing."
          fi

          if [ -d tests ] && find tests -type f -name '*.test.ts' -print -quit | grep -q .; then
            deno test tests/
          fi

      - name: Report preflight
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            BODY="✅ **Bounty PR preflight passed.** Linked bounty: #$ISSUE_NUMBER. Review/merge remains a separate step."
          else
            BODY="❌ **Bounty PR preflight failed.** Fix the reported checks and push again. No automatic approval, merge, or payout was performed."
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY" || true
